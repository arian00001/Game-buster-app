name: Build Dev Style APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify project files
        run: |
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/devstyle/gamebooster/MainActivity.kt
          test -f app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: dev-style-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
